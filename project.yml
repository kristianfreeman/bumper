# Generate the Xcode project with:  xcodegen generate
# (The .xcodeproj is a build artifact; this file is the source of truth.)
name: Bumper

options:
  bundleIdPrefix: com.kristianfreeman
  deploymentTarget:
    tvOS: "26.0"     # Apple TV 4K (2017) stops at tvOS 26; tvOS 27 APIs used when available
    iOS: "26.0"      # iPhone and iPad (Apple Intelligence's on-device model where available)
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # ── Branding: the ONLY place the user-facing name lives. ──
    APP_DISPLAY_NAME: Bumper
    PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.bumper
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # ──────────────────────────────────────────────────────────
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "3"
    DEVELOPMENT_TEAM: 5SBY45UWAH
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    # Every Apple TV (and every Apple-silicon simulator host) is arm64.
    "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      LLVM_LTO: YES_THIN

packages:
  JellyfinAppKit:
    path: Packages/JellyfinAppKit

targets:
  Bumper:
    type: application
    platform: tvOS
    sources:
      - path: App
        excludes: ["*.storekit"]
      - path: App/Configuration.storekit
        buildPhase: none
    dependencies:
      - package: JellyfinAppKit
        product: AppFeatures
      - target: BumperTopShelf
    entitlements:
      path: App/Bumper.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kristianfreeman.bumper]
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false            # HTTPS only (exempt)
        # Soot, with the still sticker (scripts/import-brand.sh).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchSymbol
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Automatic
        UIAppSupportsHDR: true
        # Jellyfin servers on home networks are usually plain HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Find Jellyfin servers and your iPhone on your network.
        NSBonjourServices: [_bumper._tcp]
        UIBackgroundModes: [audio]
        # bumper://play/<id> and bumper://item/<id> (the Top Shelf opens these).
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [bumper]
        # services/search (falls back to on-device reading when it's off or down).
        BumperSearchEndpoint: https://bumper-search.signalnerve.workers.dev/v1/interpret

  # The Top Shelf: Continue Watching and Next Up above Bumper's icon on the
  # Home Screen, from a snapshot the app writes to the app group.
  BumperTopShelf:
    type: app-extension
    platform: tvOS
    sources: [TopShelfExtension]
    dependencies:
      - package: JellyfinAppKit
        product: TopShelf
      - sdk: TVServices.framework
    entitlements:
      path: TopShelfExtension/BumperTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kristianfreeman.bumper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.bumper.topshelf
        PRODUCT_NAME: BumperTopShelf
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        SKIP_INSTALL: YES
    info:
      path: TopShelfExtension/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false            # HTTPS only (exempt)
        # Artwork comes from the Jellyfin server, usually plain HTTP at home.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider

  # Bumper for iPhone. For now it's the TV's companion (talks to the Apple TV
  # app over the local network: Packages/JellyfinAppKit/Sources/Companion);
  # it grows into the full app. Same bundle ID as the TV app: one App Store
  # listing, one themes purchase (universal purchase).
  BumperPhone:
    type: application
    platform: iOS
    sources: [iPhone]
    dependencies:
      - package: JellyfinAppKit
        product: AppFeatures
      - package: JellyfinAppKit
        product: Companion
    settings:
      base:
        PRODUCT_NAME: Bumper
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.bumper
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: iPhone/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false            # HTTPS only (exempt)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchSymbol
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Find your Jellyfin server and your Apple TV.
        NSBonjourServices: [_bumper._tcp]
        UIBackgroundModes: [audio]                 # audiobooks keep playing
        # ProMotion: without it an iPhone app's own animations and frame
        # timing stay at 60 Hz on a 120 Hz screen.
        CADisableMinimumFrameDurationOnPhone: true
        # services/search, as on the TV (smart search and subtitle ranking).
        BumperSearchEndpoint: https://bumper-search.signalnerve.workers.dev/v1/interpret

  # Bumper for Mac: the same app (AppFeatures) in a window. Same bundle ID:
  # one listing and one themes purchase across TV, iPhone, iPad and Mac.
  BumperMac:
    type: application
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: JellyfinAppKit
        product: AppFeatures
    entitlements:
      path: Mac/BumperMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true      # the companion link (Bonjour)
    settings:
      base:
        PRODUCT_NAME: Bumper
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.bumper
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false            # HTTPS only (exempt)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Find your Jellyfin server and your Apple TV.
        NSBonjourServices: [_bumper._tcp]
        # services/search, as on the TV (smart search and subtitle ranking).
        BumperSearchEndpoint: https://bumper-search.signalnerve.workers.dev/v1/interpret

  BumperPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iPhoneUITests]
    dependencies:
      - target: BumperPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.bumper.iphone.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BumperPhone
        TARGETED_DEVICE_FAMILY: "1"

  BumperUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: Bumper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristianfreeman.bumper.tv.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Bumper

schemes:
  Bumper:
    build:
      targets:
        Bumper: all
        BumperUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Configuration.storekit
      commandLineArguments:
        "-mock": false
        "-perfHUD": false
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - BumperUITests
    profile:
      config: Release
  BumperMac:
    build:
      targets:
        BumperMac: all
    run:
      config: Debug
  BumperPhone:
    build:
      targets:
        BumperPhone: all
        BumperPhoneUITests: [test]
    test:
      config: Debug
      targets:
        - BumperPhoneUITests
